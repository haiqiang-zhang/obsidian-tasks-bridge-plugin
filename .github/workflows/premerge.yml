name: "premerge"
on:
  push:
    branches:
      - "**"

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint:check
        working-directory: ./plugin

      - name: Check
        run: npm run check
        working-directory: ./plugin

      - name: Build
        run: VITE_BUNDLE_ANALYZER_MODE=static npm run build
        working-directory: ./plugin

      - name: Test
        run: npm run test
        working-directory: ./plugin

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Bundle analysis
          path: ./plugin/dist/stats.html
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: npm run build
        working-directory: ./docs
  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run check
        working-directory: ./scripts

      - name: Lint
        run: npm run lint:check
        working-directory: ./scripts

      - name: Test
        run: npm test
        working-directory: ./scripts

      - name: Generate files
        run: npm run gen
        working-directory: ./scripts

      - name: Check for generated file changes
        run: |
          # Only these files are owned by the translation-status generator.
          # Dependency installation and other platform-specific tooling must not
          # be mistaken for generated documentation changes.
          git add -- docs/docs/translation-status.json docs/docs/project-mode.md
          if git diff --staged --quiet; then
            echo "✅ No changes detected in generated files"
          else
            echo "❌ Generated files have changed. Please commit these changes:"
            git diff --staged
            exit 1
          fi
