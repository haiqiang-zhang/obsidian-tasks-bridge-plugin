<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="title">
  <title id="title">Todoist Sync ++</title>
  <defs>
    <linearGradient id="surface" x1="4" y1="3" x2="21" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset=".52" stop-color="#ef5d55" stop-opacity=".06"/>
      <stop offset="1" stop-color="#9b78f6" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="todoist-frame" x1="4" y1="3" x2="21" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff7568"/>
      <stop offset=".48" stop-color="#e34e48"/>
      <stop offset="1" stop-color="#bd343b"/>
    </linearGradient>
    <linearGradient id="todoist-plus" x1="7" y1="9" x2="14" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff7d6f"/>
      <stop offset=".55" stop-color="#e34b43"/>
      <stop offset="1" stop-color="#c83a3f"/>
    </linearGradient>
    <linearGradient id="obsidian-plus" x1="15.5" y1="5.5" x2="19" y2="9" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4adff"/>
      <stop offset=".48" stop-color="#9b78f6"/>
      <stop offset="1" stop-color="#7452d6"/>
    </linearGradient>
    <filter id="material-elevation" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="-.16" dy="-.16" stdDeviation=".12" flood-color="#ffffff" flood-opacity=".24"/>
      <feDropShadow dx="0" dy=".48" stdDeviation=".34" flood-color="#32121c" flood-opacity=".32"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="20" rx="4" fill="url(#surface)" stroke="url(#todoist-frame)" stroke-width="2" filter="url(#material-elevation)"/>
    <path d="M10.5 9v8M6.5 13h8" stroke="url(#todoist-plus)" stroke-width="2" filter="url(#material-elevation)"/>
    <path d="M17.25 5.5V9M15.5 7.25H19" stroke="url(#obsidian-plus)" stroke-width="1.75" filter="url(#material-elevation)"/>
  </g>
</svg>
